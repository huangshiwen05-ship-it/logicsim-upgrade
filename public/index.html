<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>逻辑电路图生成器 - LogicSim</title>
    <link rel="stylesheet" type="text/css" href="lib/joint.css" />
    <link rel="stylesheet" type="text/css" href="style.css" />

    <!-- 依赖（沿用原项目的 jointjs 技术栈） -->
    <script src="lib/jquery.min.js"></script>
    <script src="lib/lodash.min.js"></script>
    <script src="lib/backbone.js"></script>
    <script src="lib/graphlib.min.js"></script>
    <script src="lib/dagre.min.js"></script>
    <script src="lib/joint.js"></script>
    <script src="LogicParser.js"></script>
</head>

<body>
    <div class="joint-app">
        <!-- 顶部：输入区 -->
        <header class="app-header">
            <div class="mini-map" title="导航小地图">
                <div id="mini-paper"></div>
                <div id="mini-view">
                    <div id="mini-resize"></div>
                </div>
            </div>

            <div class="title-container">
                <section class="panel input-panel">
                    <h2 class="panel-title">① 表达式输入</h2>

                    <div class="toolbar">
                        <span class="toolbar-item file-btn">
                            <img src="assets/icons/save2.svg" width="15" height="15" alt="载入" />载入文本
                            <input type="file" id="fileToLoad" />
                        </span>
                        <button type="button" class="toolbar-item" onclick="app.saveTextAsFile()">
                            <img src="assets/icons/upload.svg" width="15" height="15" alt="保存" />保存文本
                        </button>
                        <input class="filename-input" id="inputFileNameToSaveAs" value="默认保存名称" />
                    </div>

                    <textarea id="ReversePol" placeholder="输入逆波兰逻辑表达式，例如：a b . fe >"></textarea>

                    <button type="button" class="parse-btn" onclick="app.parseLogic()">解析文本</button>

                    <div class="examples-title">可点击示例：</div>
                    <div id="examples" class="examples"></div>

                    <details class="ops-help">
                        <summary>操作符说明（逆波兰表达式）</summary>
                        <table class="ops-table">
                            <thead>
                                <tr><th>符号</th><th>含义</th><th>示例</th></tr>
                            </thead>
                            <tbody id="opsHelp"></tbody>
                        </table>
                    </details>
                </section>

                <section class="panel json-panel">
                    <h2 class="panel-title">② 图模型 JSON（文本 ↔ 图转换）</h2>
                    <textarea id="myModel" spellcheck="false">{
    "nodeArray": [],
    "linkArray": []
}</textarea>
                    <div class="btn-row">
                        <button type="button" class="ok-btn" onclick="app.load()">文本转图</button>
                        <button type="button" class="ok-btn" onclick="app.save()">图转文本</button>
                    </div>
                    <p class="hint">「解析文本」会把表达式转成 JSON 填入此处；「文本转图」把 JSON 渲染为图形；「图转文本」把当前图形写回 JSON。</p>
                </section>
            </div>
        </header>

        <!-- 中部与底部：图形 / 节点编辑 / 真值表 -->
        <div class="app-body">
            <div class="left-container"></div>

            <div class="main-container">
                <div id="paper-container">
                    <div id="paper" style="cursor:grab"></div>
                </div>
            </div>

            <div id="app-resize">
                <div class="resize-toggle"
                    onclick="app.ResizeBlock()"></div>
            </div>

            <aside class="right-container">
                <h2 class="panel-title">③ 节点编辑</h2>
                <div class="field-row">
                    <label for="ERName">元素名称</label>
                    <input type="text" id="ERName" placeholder="点击图形中的节点后编辑" />
                </div>
                <div class="field-row">
                    <label for="ERMemo">元素备注</label>
                    <textarea id="ERMemo" placeholder="点击图形中的节点后编辑"></textarea>
                </div>
                <button type="button" id="ERSetName" class="ok-btn block" onclick="app.ChangeName()">保存修改</button>
                <p class="hint">先点击图形中的某个节点，再编辑名称与备注，最后点「保存修改」。</p>
            </aside>

            <div class="bottom-container">
                <div class="status-row">
                    <span id="status">就绪：输入表达式后点击「解析文本」。</span>
                </div>
                <div id="errorMsg" class="error-msg" style="display:none"></div>
                <div class="tt-head">
                    <h2 class="panel-title">④ 真值表 <span id="ttSummary"></span></h2>
                </div>
                <div id="truthTable" class="truth-table-scroll">
                    <div class="tt-note">输入表达式并点击「解析文本」后，这里会显示真值表。</div>
                </div>
            </div>
        </div>
    </div>

    <script src="ViewGen.js"></script>
</body>

</html>
